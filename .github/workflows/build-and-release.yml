name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install Velopack
      run: dotnet tool install -g vpk

    - name: Publish Server
      run: |
        cd src/schedule-automation-app-server
        dotnet publish -c Release -r osx-arm64 --self-contained true -o ../schedule-automation-app-client/publish/mac --no-restore

    - name: Publish Client
      run: |
        cd src/schedule-automation-app-client
        dotnet publish -c Release -r osx-arm64 --self-contained true -o ./publish/mac --no-restore

    - name: Create macOS Installer
      run: |
        cd src/schedule-automation-app-client
        vpk pack \
          --packId ScheduleAutomationApp \
          --packVersion 1.0.0 \
          --packDir ./publish/mac \
          --mainExe schedule-automation-app-client \
          --packTitle "Schedule Automation App" \
          --outputDir ./installer/mac

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: macos-installer
        path: src/schedule-automation-app-client/installer/mac/*.pkg
        retention-days: 30

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: src/schedule-automation-app-client/installer/mac/*.pkg
