name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    - name: Install Velopack
      run: dotnet tool install -g vpk

    - name: Publish Server
      run: |
        dotnet publish src/schedule-automation-app-server/schedule-automation-app-server.csproj \
          -c Release \
          -r osx-arm64 \
          --self-contained true \
          -o src/schedule-automation-app-client/publish/mac

    - name: Publish Client
      run: |
        dotnet publish src/schedule-automation-app-client/schedule-automation-app-client.csproj \
          -c Release \
          -r osx-arm64 \
          --self-contained true \
          -o src/schedule-automation-app-client/publish/mac

    - name: Create macOS Installer
      run: |
        vpk pack \
          --packId ScheduleAutomationApp \
          --packVersion 1.0.0 \
          --packDir src/schedule-automation-app-client/publish/mac \
          --mainExe schedule-automation-app-client \
          --packTitle "Schedule Automation App" \
          --outputDir src/schedule-automation-app-client/installer/mac

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: macos-installer
        path: src/schedule-automation-app-client/installer/mac/*.pkg
        retention-days: 30
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: src/schedule-automation-app-client/installer/mac/*.pkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
