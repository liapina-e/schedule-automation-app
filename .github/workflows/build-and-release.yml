name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish Server
      run: |
        dotnet publish src/schedule-automation-app-server/schedule-automation-app-server.csproj \
          -c Release \
          -r osx-arm64 \
          --self-contained true \
          -o published/mac

    - name: Publish Client
      run: |
        dotnet publish src/schedule-automation-app-client/schedule-automation-app-client.csproj \
          -c Release \
          -r osx-arm64 \
          --self-contained true \
          -o published/mac

    - name: Build .app bundle
      run: |
        APP=ScheduleAutomationApp.app
        mkdir -p "$APP/Contents/MacOS"
        mkdir -p "$APP/Contents/Resources"
        cp -r published/mac/* "$APP/Contents/MacOS/"
        cat > "$APP/Contents/Info.plist" << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleExecutable</key>
          <string>schedule-automation-app-client</string>
          <key>CFBundleIdentifier</key>
          <string>ru.hse.schedule-automation-app</string>
          <key>CFBundleName</key>
          <string>ScheduleAutomationApp</string>
          <key>CFBundleVersion</key>
          <string>1.0.0</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
        </dict>
        </plist>
        EOF

    - name: Create postinstall script
      run: |
        mkdir -p scripts
        cat > scripts/postinstall << 'SCRIPT'
        #!/bin/bash
        xattr -cr /Applications/ScheduleAutomationApp.app
        chmod +x /Applications/ScheduleAutomationApp.app/Contents/MacOS/schedule-automation-app-server
        chmod +x /Applications/ScheduleAutomationApp.app/Contents/MacOS/schedule-automation-app-client
        SCRIPT
        chmod +x scripts/postinstall

    - name: Create .pkg installer
      run: |
        pkgbuild \
          --root ScheduleAutomationApp.app \
          --identifier ru.hse.schedule-automation-app \
          --version 1.0.0 \
          --install-location /Applications/ScheduleAutomationApp.app \
          --scripts scripts \
          ScheduleAutomationApp.pkg

    - name: Upload Installer as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-installer
        path: ScheduleAutomationApp.pkg
        retention-days: 30

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ScheduleAutomationApp.pkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish Server
      run: |
        dotnet publish src/schedule-automation-app-server/schedule-automation-app-server.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -o published\win

    - name: Publish Client
      run: |
        dotnet publish src/schedule-automation-app-client/schedule-automation-app-client.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -o published\win

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Create Inno Setup script
      run: |
        $script = @"
        [Setup]
        AppName=Schedule Automation App
        AppVersion=1.0.0
        DefaultDirName={autopf}\ScheduleAutomationApp
        DefaultGroupName=Schedule Automation App
        OutputDir=installer\win
        OutputBaseFilename=ScheduleAutomationApp-Setup
        Compression=lzma
        SolidCompression=yes
        WizardStyle=modern
        PrivilegesRequired=admin

        [Files]
        Source: "published\win\*"; DestDir: "{app}"; Flags: recursesubdirs

        [Icons]
        Name: "{group}\Schedule Automation App"; Filename: "{app}\schedule-automation-app-client.exe"
        Name: "{userdesktop}\Schedule Automation App"; Filename: "{app}\schedule-automation-app-client.exe"

        [Run]
        Filename: "{app}\schedule-automation-app-client.exe"; Description: "Launch application"; Flags: nowait postinstall skipifsilent
        "@
        New-Item -ItemType Directory -Force -Path installer\win
        Set-Content -Path setup.iss -Value $script

    - name: Build installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: installer\win\ScheduleAutomationApp-Setup.exe
        retention-days: 30

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: installer\win\ScheduleAutomationApp-Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
